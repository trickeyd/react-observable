name: Release and Publish

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: release')"

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # We need to fetch all history and tags for git-version-all to work correctly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # `npm stage publish` needs npm >= 11
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm CLI for staged publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Bump version, Publish, and Push
        run: |
          yarn version --patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing new version: $VERSION"

          # Current NPM_TOKEN is stage-only (E_STAGE_REQUIRED on `npm publish`).
          npm stage publish --access public

          git add package.json
          git commit -m "chore: release v$VERSION"

          git tag "v$VERSION"

          git push --follow-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
